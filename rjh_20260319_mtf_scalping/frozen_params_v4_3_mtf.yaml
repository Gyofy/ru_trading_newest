# Multi-Timeframe Strategy Config -- v4.3-MTF
# 5분봉 방향 확인 → 1분봉 정밀 진입
#
# 문제: 1분봉 단독으로 돌리면 노이즈에 즉시 청산
# 해결: 5분봉 모델이 방향(LONG/SHORT)을 결정하고,
#       1분봉 모델이 진입 타이밍만 결정
#
# SL 설계: 레버리지 4x에서 한 번 SL = equity의 ~0.5%가 되도록
#   risk_frac = 0.005 → 실제 risk = 0.5% / 4x = 마진 대비 2%
#   SL 거리 = 5분봉 ATR × 2.0 (1분봉 ATR 아닌 상위 TF ATR 사용)

version: "v4.3-mtf"
frozen_date: "2026-03-19"

# ── 5분봉 (방향 결정 TF) ─────────────────────────────
tf_5m:
  bar_minutes: 5
  horizons: [6, 12, 24, 48]          # 30m, 1h, 2h, 4h
  max_horizon: 48                     # 4시간 보유 상한 (방향 유효 기간)
  k_upper: 3.0                       # 대칭 라벨링
  k_lower: 3.0
  min_barrier_pct: 0.005
  stage1_threshold: 0.48             # 5분봉 진입 빈도 확보
  role: "direction"

# ── 1분봉 (진입 타이밍 + 실행 TF) ────────────────────
tf_1m:
  bar_minutes: 1
  horizons: [5, 15, 30, 60]          # 5m, 15m, 30m, 1h
  max_horizon: 60                     # 1시간 보유 상한 (빠른 회전)
  k_upper: 2.0                       # 라벨링: 대칭
  k_lower: 2.0
  min_barrier_pct: 0.005
  stage1_threshold: 0.50             # 5분봉 확인 후라 약간 완화
  role: "timing+execution"

# ── 실행 배리어 (스캘핑 최적화) ───────────────────────
execution:
  leverage: 4
  # 고정 비율 배리어 (ATR 무시 — 스캘핑에서는 시간 내 도달 가능한 거리가 핵심)
  sl_fixed_pct: 0.004                # SL = 0.4% (4x → 마진 1.6%)
  tp1_fixed_pct: 0.003               # TP1 = 0.3% → 50% 청산 + SL→BEP
  tp2_fixed_pct: 0.006               # TP2 = 0.6% → 나머지 청산
  # ATR mult는 fallback으로만 사용
  sl_atr_mult: 2.0
  tp1_atr_mult: 0.5
  tp2_atr_mult: 1.0
  tp3_atr_mult: 0
  min_sl_pct: 0.004
  max_sl_pct: 0.008
  min_tp_pct: 0.003
  # TTL
  max_hold_minutes: 30               # 30분 최대
  min_barrier_pct: 0.003

# ── MTF 진입 조건 ────────────────────────────────────
entry_rules:
  require_direction_match: true       # 5m + 1m 방향 일치 필수
  entry_window_5m_bars: 12           # 1시간 이내에 1분봉 확인 필요
  min_5m_confidence: 0.45
  min_1m_confidence: 0.50
  max_positions: 3

# ── 코인별 모델 (Mega Search v3 결과 기반) ─────────────
# 5분봉/1분봉 각각 재탐색 필요 — 일단 4h 결과 적용
coins:
  TAO:
    model_combo: "cb+xgb"
    model_weights: { cb: 0.5, xgb: 0.5 }
  DOT:
    model_combo: "et+xgb"
    model_weights: { et: 0.7, xgb: 0.3 }
  ADA:
    model_combo: "et+tabm"
    model_weights: { et: 0.7, tabm: 0.3 }
  XRP:
    model_combo: "et+tabm"
    model_weights: { et: 0.7, tabm: 0.3 }
  SOL:
    model_combo: "et+tabm"
    model_weights: { et: 0.7, tabm: 0.3 }
  LINK:
    model_combo: "xgb"
    model_weights: { xgb: 1.0 }
  BTC:
    model_combo: "et+cb"
    model_weights: { et: 0.5, cb: 0.5 }
  ETH:
    model_combo: "et+tabm"
    model_weights: { et: 0.7, tabm: 0.3 }

# ── Sizing (레버리지 조정) ───────────────────────────
sizing_tiers:
  tier_high: 0.010                  # conf > 0.65 → 1.0% (레버리지 4x → 실질 4%)
  tier_mid: 0.007                   # conf 0.50-0.65 → 0.7%
  tier_low: 0.005                   # conf < 0.50 → 0.5%
  dd_brake_threshold: 0.01          # DD 1%에서 브레이크 (4x라 조기)

# ── Risk ─────────────────────────────────────────────
risk:
  daily_drawdown_pct: 0.02
  weekly_drawdown_pct: 0.05
  max_notional_usdt: 2000           # 4x 레버리지 → 실제 마진 $500
  min_stop_distance_pct: 0.003      # 최소 SL 0.3%
