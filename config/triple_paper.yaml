version: "v10.0-triple-paper"
mode: "paper"
initial_equity: 5000.0
daily_loss_limit: 0.20

coins:
  - XRP
  - SOL
  - DOGE
  - ADA
  - DOT
  - AVAX
  - BNB

dynamic_coins:
  enabled: true
  volatility_pool: 30
  selective_pool_size: 20
  min_volume_usdt: 500000000  # real production filter: $500M
  max_spread_bps: 8.0         # real production filter: 8bps
  refresh_interval_sec: 900
  base_coins:
    - XRP
    - SOL
    - DOGE
    - ADA
    - BTC
    - ETH
    - BNB
    - DOT
    - AVAX
    - OP
    - ARB
    - SUI
  exclude_coins:
    - APT
    - TAO
    - BTC
    - LINK

portfolio:
  total_exposure_pct: 0.80
  same_direction_max: 3
  daily_loss_pct: 0.20
  strategy_loss_pct: 0.40
  min_notional_usdt: 5.0
  max_funding_rate: 0.001

position_sizing:
  risk_pct_per_trade: 0.02
  vol_adjust_enabled: true
  spread_adjust_enabled: true
  confidence_adjust_enabled: true
  min_factor: 0.5
  max_factor: 2.0

strategies:
  cvd_extreme:
    enabled: true
    allocation_usdt: 500.0
    leverage: 3
    cycle_seconds: 60
    max_positions: 3
    sl_atr_mult: 2.0
    extra:
      cvd_quantile: 0.92
      cvd_sigma_mult: 1.5
      cvd_roll_window: 240
      volume_spike_mult: 1.2
      tp_rr: 2.5
      max_daily_trades: 30
      cooldown_sec: 120

  liquidation_fade:
    enabled: true
    allocation_usdt: 500.0
    leverage: 3
    cycle_seconds: 60
    max_positions: 3
    sl_atr_mult: 2.5
    extra:
      oi_sigma_threshold: 0.8
      taker_spike_mult: 1.0
      swing_lookback: 24
      tp_atr_mult: 5.0

  vwap_reversion:
    enabled: true
    allocation_usdt: 500.0
    leverage: 3
    cycle_seconds: 60
    max_positions: 3
    sl_atr_mult: 2.0
    extra:
      vwap_window: 60
      sigma_mult: 1.2
      vol_decay_threshold: 0.85
      tp_rr: 2.0

  funding_arb:
    enabled: true
    allocation_usdt: 500.0
    leverage: 3
    cycle_seconds: 60
    max_positions: 3
    sl_atr_mult: 2.0
    extra:
      fast_ema: 8
      slow_ema: 21
      min_body_pct: 0.001
      tp_rr: 3.0

  volume_impulse:
    enabled: true
    allocation_usdt: 500.0
    leverage: 3
    cycle_seconds: 60
    max_positions: 3
    sl_atr_mult: 2.0
    extra:
      volume_mult: 3.0
      min_body_pct: 0.002
      lookback: 50
      tp_rr: 3.0

  oi_divergence:
    enabled: true
    allocation_usdt: 500.0
    leverage: 3
    cycle_seconds: 120
    max_positions: 3
    sl_atr_mult: 2.5
    extra:
      price_lookback: 12
      min_price_move_pct: 0.002
      oi_change_threshold: 0.003
      tp_rr: 2.5

  momentum_breakout:
    enabled: false
    allocation_usdt: 0
    leverage: 1
    cycle_seconds: 60
    max_positions: 0
    sl_atr_mult: 2.0
    extra: {}
  cvd_spike:
    enabled: false
    allocation_usdt: 0
    leverage: 1
    cycle_seconds: 60
    max_positions: 0
    sl_atr_mult: 3.0
    extra: {}
  asymmetric_sniper:
    enabled: false
    allocation_usdt: 0
    leverage: 1
    cycle_seconds: 60
    max_positions: 0
    sl_atr_mult: 2.5
    extra: {}

monitoring:
  sl_tp_poll_seconds: 15
  heartbeat_seconds: 60

exchange:
  maker_fee: 0.0002
  taker_fee: 0.0005
  slippage_entry: 0.0005
  slippage_exit: 0.0005
  liquidation_fee: 0.005

multiprocessing:
  workers: 4

entry_filters:
  vpin_filter_enabled: true
  vpin_min: 0.30
  blacklist_enabled: true
  blacklist_sl_count: 2
  blacklist_window_sec: 86400
  atr_regime_enabled: true
  atr_min_percentile: 15

ev_guardian:
  fee_budget_pct: 0.005
  ev_threshold: -0.01
  ev_min_sample: 50

fee_optimization:
  bnb_keeper:
    enabled: false
    min_bnb_usdt: 10.0
    check_interval_sec: 3600
  fee_scanner:
    enabled: true
    scan_interval_sec: 86400
  spread_filter:
    max_entry_spread_bps: 8.0
  commission_check:
    enabled: true
