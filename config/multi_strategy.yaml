version: "v9.0-cvd-extreme"
mode: "demo"  # paper | demo (testnet) | live
initial_equity: 5000.0
daily_loss_limit: 0.20  # -20%

coins:  # fallback list (used when dynamic_coins disabled or fetch fails)
  - XRP
  - SOL
  - DOGE
  - ADA
  - DOT
  - AVAX
  - BNB

dynamic_coins:
  enabled: true
  volatility_pool: 30            # 변동성 상위 N개를 후보 풀로
  selective_pool_size: 20        # base_coins 제외 선택적 풀 최대 개수
  min_volume_usdt: 50000         # $50K (testnet: 실제 볼륨 낮아 완화)
  max_spread_bps: 50.0           # testnet 완화
  refresh_interval_sec: 900      # 15분마다 갱신
  base_coins:                    # 항상 포함 — 필터 무관 (testnet: bid/ask=0 우회)
    - XRP
    - SOL
    - DOGE
    - ADA
    - BTC
    - ETH
    - BNB
    - DOT
    - AVAX
    - OP
    - ARB
    - SUI
  exclude_coins:                 # 동적 풀에서도 완전 제외
    - APT
    - TAO
    - BTC
    - LINK    # 10건 전패 (WR 0%, -$118) — 데이터 축적 후 재평가

portfolio:
  total_exposure_pct: 10.0       # 1000% — 데이터 수집 모드 (중첩 최대화)
  same_direction_max: 30         # 30개 동방향 허용 (중첩 클러스터 관찰)
  daily_loss_pct: 0.50           # 일일 손실 50% (데모: 데이터>자본)
  strategy_loss_pct: 0.80        # 전략별 80% (데모)
  min_notional_usdt: 5.0
  max_funding_rate: 0.01         # 1% (데모: 펀딩 무시)

position_sizing:
  risk_pct_per_trade: 0.15       # 15% per trade
  vol_adjust_enabled: true
  spread_adjust_enabled: false   # testnet 스프레드 패널티 제거
  confidence_adjust_enabled: true
  min_factor: 0.7
  max_factor: 3.0

  # ══════════════════════════════════════════════════════════════
  # v9.1 Data-Gathering Mode: 전면 시장가(Taker) 진입
  #   Entry(Market taker): 0.05%  |  Exit(taker SL/TP): 0.05%
  #   Slippage: entry 0.05% + exit 0.05%
  #   왕복 = 0.05% + 0.05% + 0.05% + 0.05% = 0.20% of NOTIONAL
  #   수수료는 NOTIONAL(=qty×price)에 부과, 마진이 아님!
  #   → 3x: 0.20%×3 = 0.60%/자본
  # 데이터 수집 최우선: 모든 시그널 체결, SL 넉넉, 중첩 허용
  # ══════════════════════════════════════════════════════════════

strategies:
  # ════════════════════════════════════════════════════════════════
  # v9.1 DATA-GATHERING MODE
  # 목표: 최대한 많은 시그널 체결, 넓은 SL, 중첩 허용
  # → MFE/MAE 한계치 데이터 수집 → 실전용 SL/TP 수학적 세팅
  # ════════════════════════════════════════════════════════════════

  # ── 1. CVD Extreme — CVD Q92+Z1.5σ 역추세 ──
  cvd_extreme:
    enabled: true
    allocation_usdt: 2000.0        # $1,500→$2,000 (데이터 수집용 확대)
    leverage: 3
    cycle_seconds: 45              # 60→45s (빠른 스캔)
    max_positions: 15              # 8→15 (중첩 최대화)
    sl_atr_mult: 4.0               # 2.0→4.0 (SL 넉넉하게, MAE 데이터 수집)
    extra:
      cvd_quantile: 0.90           # Q92→Q90 (빈도 확대)
      cvd_sigma_mult: 1.2          # Z1.5→Z1.2 (빈도 확대)
      cvd_roll_window: 240
      volume_spike_mult: 1.0       # 1.2→1.0 (최소 필터)
      tp_rr: 3.0                   # 2.5→3.0 (MFE 한계 관찰)
      max_daily_trades: 100        # 30→100 (데이터 수집)
      cooldown_sec: 60             # 2분→1분

  # ── 2. Cascade Fade — OI급감 + 거래량 스파이크 반전 ──
  liquidation_fade:
    enabled: true
    allocation_usdt: 2000.0
    leverage: 3
    cycle_seconds: 45
    max_positions: 15
    sl_atr_mult: 5.0               # 2.5→5.0 (SL 넉넉하게)
    extra:
      oi_sigma_threshold: 0.5      # 0.8→0.5 (빈도 확대)
      taker_spike_mult: 0.8        # 1.0→0.8 (빈도 확대)
      swing_lookback: 24
      tp_atr_mult: 7.0             # 5.0→7.0 (MFE 한계 관찰)

  # ── 3. VWAP Exhaustion — VWAP 이탈 + 거래량 감소 = 소진 복귀 ──
  vwap_reversion:
    enabled: true
    allocation_usdt: 2000.0
    leverage: 3
    cycle_seconds: 45
    max_positions: 15
    sl_atr_mult: 4.0               # 2.0→4.0
    extra:
      vwap_window: 60
      sigma_mult: 1.2              # 1.5→1.2 (빈도 확대)
      vol_decay_threshold: 0.85    # 0.8→0.85 (완화)
      tp_rr: 2.5                   # 2.0→2.5

  # ── 4. MTF Momentum — 1m+15m+1h 추세 정렬 추종 ──
  funding_arb:
    enabled: true
    allocation_usdt: 2000.0
    leverage: 3
    cycle_seconds: 45
    max_positions: 15
    sl_atr_mult: 4.0               # 2.0→4.0
    extra:
      fast_ema: 8
      slow_ema: 21
      min_body_pct: 0.0005         # 0.001→0.0005 (빈도 확대)
      tp_rr: 4.0                   # 3.0→4.0

  # ── 5. Volume Impulse — 거래량 3x 폭증 + 방향 추종 ──
  volume_impulse:
    enabled: true
    allocation_usdt: 2000.0
    leverage: 3
    cycle_seconds: 45
    max_positions: 15
    sl_atr_mult: 4.0               # 2.0→4.0
    extra:
      volume_mult: 2.5             # 3.0→2.5 (빈도 확대)
      min_body_pct: 0.001          # 0.002→0.001 (빈도 확대)
      lookback: 50
      tp_rr: 4.0                   # 3.0→4.0

  # ── 6. OI Divergence — 가격-OI 괴리 4패턴 ──
  oi_divergence:
    enabled: true
    allocation_usdt: 2000.0
    leverage: 3
    cycle_seconds: 90              # 120→90s (빈도 확대)
    max_positions: 15
    sl_atr_mult: 5.0               # 2.5→5.0
    extra:
      price_lookback: 12
      min_price_move_pct: 0.001    # 0.002→0.001 (빈도 확대)
      oi_change_threshold: 0.002   # 0.003→0.002 (빈도 확대)
      tp_rr: 3.0                   # 2.5→3.0

  # ── 비활성 (v8.x 레거시) ──
  momentum_breakout:
    enabled: false
    allocation_usdt: 0
    leverage: 1
    cycle_seconds: 60
    max_positions: 0
    sl_atr_mult: 2.0
    extra: {}
  cvd_spike:
    enabled: false
    allocation_usdt: 0
    leverage: 1
    cycle_seconds: 60
    max_positions: 0
    sl_atr_mult: 3.0
    extra: {}
  asymmetric_sniper:
    enabled: false
    allocation_usdt: 0
    leverage: 1
    cycle_seconds: 60
    max_positions: 0
    sl_atr_mult: 2.5
    extra: {}

monitoring:
  sl_tp_poll_seconds: 15
  heartbeat_seconds: 60

exchange:
  maker_fee: 0.0005      # v9.1: 시장가 Taker 진입 (Post-Only 폐기)
  taker_fee: 0.0005      # 0.0500% — Binance USDM VIP 0 Taker
  slippage_entry: 0.0005  # 시장가 슬리피지
  slippage_exit: 0.0005
  liquidation_fee: 0.005 # 0.5000% — 강제 청산 시

multiprocessing:
  workers: 10

entry_filters:
  vpin_filter_enabled: true
  vpin_min: 0.3
  blacklist_enabled: true
  blacklist_sl_count: 2
  blacklist_window_sec: 86400
  atr_regime_enabled: true
  atr_min_percentile: 15          # 10→15: 저변동성 차단 강화

ev_guardian:
  fee_budget_pct: 100.0  # 수수료 예산: 사실상 무제한 (demo)
  ev_threshold: -0.05    # EV < -5.0% → 매우 느슨 (데이터 수집 우선, 조기 차단 방지)
  ev_min_sample: 100     # 100건 이상 (데이터 수집: 최대한 늦게 판단)

fee_optimization:
  bnb_keeper:
    enabled: false            # 비활성화: Futures 계좌에서 매수 시 BNB 선물 포지션 생성됨
    min_bnb_usdt: 10.0        # BNB 잔고 최소값 (USDT 기준) — Spot 지갑에서 수동 유지 필요
    check_interval_sec: 3600  # 1시간마다 체크
  fee_scanner:
    enabled: true
    scan_interval_sec: 86400
  spread_filter:
    max_entry_spread_bps: 8.0
  commission_check:
    enabled: true
