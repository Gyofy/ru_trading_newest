version: "v8.3-demo"
mode: "demo"  # paper | demo (testnet) | live
initial_equity: 5000.0
daily_loss_limit: 0.20  # -20%

coins:  # fallback list (used when dynamic_coins disabled or fetch fails)
  - XRP
  - SOL
  - TAO
  - DOGE
  - ADA
  - DOT
  - AVAX
  - BNB
  - LINK

dynamic_coins:
  enabled: true
  volatility_pool: 30            # 변동성 상위 N개를 후보 풀로
  selective_pool_size: 20        # base_coins 제외 선택적 풀 최대 개수
  min_volume_usdt: 50000         # $50K (testnet: 실제 볼륨 낮아 완화)
  max_spread_bps: 50.0           # testnet 완화
  refresh_interval_sec: 900      # 15분마다 갱신
  base_coins:                    # 항상 포함 — 필터 무관 (testnet: bid/ask=0 우회)
    - XRP
    - SOL
    - DOGE
    - ADA
    - BTC
    - ETH
    - BNB
    - DOT
    - AVAX
    - LINK
    - OP
    - ARB
    - SUI
    # TAO, APT 제외: testnet에서 유동성 부족으로 WaitFill timeout 반복 (실측)

portfolio:
  total_exposure_pct: 5.0        # 공격적: 500% 허용 — 전략 합산 최대 notional 대응
  same_direction_max: 8          # 더 많은 동방향 포지션 허용
  daily_loss_pct: 0.20           # 일일 손실 한도 완화 (가상거래)
  strategy_loss_pct: 0.40
  min_notional_usdt: 5.0
  max_funding_rate: 0.003

position_sizing:
  risk_pct_per_trade: 0.15       # 15% — 공격적 투자 (↑ from 8%)
  vol_adjust_enabled: true
  spread_adjust_enabled: false   # testnet 스프레드 패널티 제거
  confidence_adjust_enabled: true
  min_factor: 0.7                # 최소 포지션 크기 (↑ from 0.5)
  max_factor: 3.0                # 최대 포지션 크기 (↑ from 2.0)

strategies:
  cvd_spike:
    enabled: true
    allocation_usdt: 4500.0
    leverage: 5
    cycle_seconds: 60
    max_positions: 10
    sl_atr_mult: 3.0
    extra:
      cvd_quantile: 0.90
      ofi_quantile: 0.90
      cvd_roll_window: 240
      trailing_atr_mult: 0.7          # 2.0→0.7: mfe/trail=0.37 실측 기반 축소
      tp_rr_ratio: 2.0

  liquidation_fade:
    enabled: true
    allocation_usdt: 2250.0
    leverage: 4
    cycle_seconds: 60
    max_positions: 6
    sl_atr_mult: 2.5
    extra:
      oi_sigma_threshold: 1.2
      taker_spike_mult: 1.2
      swing_lookback: 24
      tp_atr_mult: 3.75

  momentum_breakout:
    enabled: true
    allocation_usdt: 2250.0
    leverage: 5
    cycle_seconds: 60
    max_positions: 6
    sl_atr_mult: 2.0
    extra:
      volume_mult_threshold: 1.8
      range_lookback_hours: 12
      trailing_atr_mult: 0.7          # 2.0→0.7: mfe/trail=0.37 실측 기반 축소
      tp_rr_ratio: 2.0
      leverage_base: 5
      leverage_confirmed: 5
      min_move_pct: 0.003

  asymmetric_sniper:
    enabled: true
    allocation_usdt: 4500.0
    leverage: 7
    cycle_seconds: 60
    max_positions: 6
    sl_atr_mult: 1.0
    extra:
      risk_per_trade_usdt: 100.0
      rr_minimum: 3.0
      cvd_quantile: 0.95
      cvd_sigma_mult: 1.8
      cvd_roll_window: 240
      funding_threshold: 0.0001
      funding_filter_enabled: false
      funding_skip_on_null: false
      rr_check_enabled: false
      cooldown_bars: 10
      max_daily_trades: 12
      trailing_atr_mult_initial: 0.8    # 2.0→0.8: mfe/trail=0.37 실측 기반 축소
      trailing_atr_mult_tight: 0.4      # 1.0→0.4: profit tighten 구간 강화
      profit_tighten_threshold_atr: 0.8  # 1.5→0.8: 더 일찍 tighten 시작

monitoring:
  sl_tp_poll_seconds: 15
  heartbeat_seconds: 60

exchange:
  maker_fee: 0.0002
  taker_fee: 0.00055
  slippage_entry: 0.0003
  slippage_exit: 0.0005

multiprocessing:
  workers: 6
