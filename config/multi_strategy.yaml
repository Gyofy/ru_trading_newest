version: "v8.7-demo"
mode: "demo"  # paper | demo (testnet) | live
initial_equity: 5000.0
daily_loss_limit: 0.20  # -20%

coins:  # fallback list (used when dynamic_coins disabled or fetch fails)
  - XRP
  - SOL
  - TAO
  - DOGE
  - ADA
  - DOT
  - AVAX
  - BNB
  - LINK

dynamic_coins:
  enabled: true
  volatility_pool: 30            # 변동성 상위 N개를 후보 풀로
  selective_pool_size: 20        # base_coins 제외 선택적 풀 최대 개수
  min_volume_usdt: 50000         # $50K (testnet: 실제 볼륨 낮아 완화)
  max_spread_bps: 50.0           # testnet 완화
  refresh_interval_sec: 900      # 15분마다 갱신
  base_coins:                    # 항상 포함 — 필터 무관 (testnet: bid/ask=0 우회)
    - XRP
    - SOL
    - DOGE
    - ADA
    - BTC
    - ETH
    - BNB
    - DOT
    - AVAX
    - LINK
    - OP
    - ARB
    - SUI
    # TAO, APT 제외: testnet에서 유동성 부족으로 WaitFill timeout 반복 (실측)
  exclude_coins:                 # 동적 풀에서도 완전 제외
    - APT
    - TAO
    - BTC
    - LINK

portfolio:
  total_exposure_pct: 6.0        # 600% — 레버리지 감소분 보상: 더 많은 동시 포지션 허용
  same_direction_max: 12         # 8→12: 동방향 포지션 한도 확대
  daily_loss_pct: 0.20           # 일일 손실 한도 완화 (가상거래)
  strategy_loss_pct: 0.40
  min_notional_usdt: 5.0
  max_funding_rate: 0.003

position_sizing:
  risk_pct_per_trade: 0.20       # 15%→20%: 레버리지 감소 보상 (5x×20% ≈ 8x×15%)
  vol_adjust_enabled: true
  spread_adjust_enabled: false   # testnet 스프레드 패널티 제거
  confidence_adjust_enabled: true
  min_factor: 0.7                # 최소 포지션 크기
  max_factor: 4.0                # 3.0→4.0: 고신뢰 신호 시 더 큰 포지션 허용

strategies:
  cvd_spike:
    enabled: true
    allocation_usdt: 9000.0          # ×2: 수량 2배 증가
    leverage: 6                      # +1: 5→6
    cycle_seconds: 60
    max_positions: 15                # 10→15: 동시 포지션 한도 확대
    sl_atr_mult: 5.0                 # 3.0→5.0: ATR 저변동성에서 SL too tight 방지
    extra:
      cvd_quantile: 0.92             # 0.97→0.92: 신호 생성 빈도 증가
      ofi_quantile: 0.92             # 0.97→0.92: 신호 생성 빈도 증가
      cvd_roll_window: 240
      trailing_atr_mult: 0.7          # 2.0→0.7: mfe/trail=0.37 실측 기반 축소
      tp_rr_ratio: 3.0
      volume_spike_mult: 1.5         # 2.0→1.5: 볼륨 조건 완화
      oi_decline_pct: -0.2           # -0.5→-0.2: OI 하락 조건 완화

  liquidation_fade:
    enabled: true
    allocation_usdt: 4500.0          # ×2: 수량 2배 증가
    leverage: 5                      # +1: 4→5
    cycle_seconds: 60
    max_positions: 10                # 6→10: 동시 포지션 한도 확대
    sl_atr_mult: 3.5                 # 2.5→3.5: 수수료 극복 위해 SL 넓힘
    extra:
      oi_sigma_threshold: 1.2
      taker_spike_mult: 1.2
      swing_lookback: 24
      tp_atr_mult: 7.5

  momentum_breakout:
    enabled: false
    allocation_usdt: 4500.0          # ×2: 수량 2배 증가
    leverage: 6                      # +1: 5→6
    cycle_seconds: 60
    max_positions: 6
    sl_atr_mult: 2.0
    extra:
      volume_mult_threshold: 1.8
      range_lookback_hours: 12
      trailing_atr_mult: 0.7          # 2.0→0.7: mfe/trail=0.37 실측 기반 축소
      tp_rr_ratio: 3.0
      leverage_base: 6               # +1: 5→6
      leverage_confirmed: 6          # +1: 5→6
      min_move_pct: 0.003

  asymmetric_sniper:
    enabled: true
    allocation_usdt: 9000.0          # ×2: 수량 2배 증가
    leverage: 5                      # 8→5: 수수료 극복 위해 레버리지 축소
    cycle_seconds: 60
    max_positions: 10                # 6→10: 동시 포지션 한도 확대
    sl_atr_mult: 2.5                 # 1.0→2.5: 수수료(0.18%) 극복 위해 SL 넓힘
    extra:
      risk_per_trade_usdt: 300.0     # 200→300: 레버리지 감소 보상 (거래당 리스크 증가)
      rr_minimum: 3.0
      cvd_quantile: 0.90             # 0.92→0.90: 신호 빈도 소폭 증가
      cvd_sigma_mult: 1.8            # 2.0→1.8: 품질 유지하면서 신호 빈도 균형
      cvd_roll_window: 240
      funding_threshold: 0.0001
      funding_filter_enabled: false
      funding_skip_on_null: false
      rr_check_enabled: false
      cooldown_bars: 3               # 5→3: 쿨다운 단축 (더 빠른 재진입)
      max_daily_trades: 40           # 20→40: 일일 거래 한도 2배 증가
      trailing_atr_mult_initial: 0.8    # 2.0→0.8: mfe/trail=0.37 실측 기반 축소
      trailing_atr_mult_tight: 0.4      # 1.0→0.4: profit tighten 구간 강화
      profit_tighten_threshold_atr: 0.8  # 1.5→0.8: 더 일찍 tighten 시작

monitoring:
  sl_tp_poll_seconds: 15
  heartbeat_seconds: 60

exchange:
  maker_fee: 0.0002      # 0.0200% — Binance USDM VIP 0 Maker (Post-Only)
  taker_fee: 0.0005      # 0.0500% — Binance USDM VIP 0 Taker (수정: 0.00055→0.0005)
  slippage_entry: 0.0003
  slippage_exit: 0.0005
  liquidation_fee: 0.005 # 0.5000% — 강제 청산 시 별도 부과 (일반 거래 수수료와 별개)

multiprocessing:
  workers: 10  # 80% of 12 cores (auto-detected at runtime, this is fallback)


entry_filters:
  vpin_filter_enabled: true
  vpin_min: 0.3
  blacklist_enabled: true
  blacklist_sl_count: 2
  blacklist_window_sec: 86400
  atr_regime_enabled: true
  atr_min_percentile: 10             # 20→10: ATR 레짐 필터 완화

ev_guardian:
  # F5: 일일 수수료 예산 — 데이터 수집 모드: 수익이 나면 cap 불필요.
  # 잔고가 0원이 될때까지 진행하는 데이터 수집 목적이므로 사실상 무제한.
  fee_budget_pct: 100.0  # 사실상 비활성화 ($5000 × 100 = $500,000/day cap)
  # F1: EV 차단 임계값 — 데이터 수집 모드: -100% 로 설정 (사실상 비활성화)
  # 기본값 -0.15% (EV_THRESHOLD) 대신 매우 낮은 값으로 설정해 전략이 차단되지 않게 함
  ev_threshold: -1.0    # -100% → F1_EV 차단 비활성화 (데이터 수집 모드)
  ev_min_sample: 9999   # 충분한 샘플 수 없으면 EV 판단 안 함

fee_optimization:
  bnb_keeper:
    enabled: true
    min_bnb_usdt: 10.0        # BNB 잔고 최소값 (USDT 기준) — 미만이면 시장가 매수
    check_interval_sec: 3600  # 1시간마다 체크
  fee_scanner:
    enabled: true
    scan_interval_sec: 86400  # 24시간마다 스캔 (Binance API rate limit 고려)
  spread_filter:
    max_entry_spread_bps: 8.0  # 진입 시 최대 허용 스프레드 (8bps = 0.08%)
  commission_check:
    enabled: true              # 시작 시 수수료율 확인 및 Discord 알림
