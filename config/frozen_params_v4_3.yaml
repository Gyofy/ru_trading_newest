# Frozen Parameters v4.3 -- 2026-03-18
# v4.2 + RL Meta-Strategy Layer (LinUCB Contextual Bandit)
#
# v4.2 → v4.3 변경:
#   1. RL gate 추가: LinUCB 4-action (REJECT, ACCEPT_0.75, ACCEPT_1.00, ACCEPT_1.25)
#   2. Cycle-level candidate ranking (rl_score 내림차순, top_k)
#   3. Signal logger for offline learning + counterfactual
#   4. Shadow mode: RL 추천만 기록, 실제 거래는 v4.2 동일

version: "v4.3"
frozen_date: "2026-03-18"
source: "v4.2 + RL meta-layer design v2"

# ── Common Parameters (unchanged from v4.2) ────────────
common:
  k_upper: 3.0
  k_lower: 0.6
  risk_frac: 0.005
  max_horizon: 18
  bar_minutes: 240
  min_barrier_pct: 0.002

# ── Cost Model (unchanged) ─────────────────────────────
cost_model:
  maker_fee: 0.0002
  taker_fee: 0.00055
  slippage_entry: 0.0003
  slippage_exit_limit: 0.0001
  slippage_exit_market: 0.0005
  funding_interval_hours: 8.0
  funding_default_rate: 0.0001
  miss_fill_reject_prob: 0.15
  miss_fill_missed_ev: 0.0015

# ── Feature Policy (unchanged) ─────────────────────────
excluded_feature_keywords:
  - macro_gold
  - macro_vix
  - macro_usd_index
  - macro_us_10y
  - macro_sp500
  - macro_fear_greed
  - macro_defi_tvl
  - hilbert
  - inst_phase
  - inst_freq
  - inst_amp

blocked_regimes:
  - RANGE_LOW

# ── Microstructure (unchanged) ─────────────────────────
microstructure:
  cvd_filter_enabled: true
  cvd_long_mult_high: 0.6
  cvd_long_mult_low: 1.2
  ofi_timing_enabled: true
  ofi_timing_mult: 1.1
  flow_pressure_weight: 0.3

# ── Model Architecture (unchanged) ────────────────────
model:
  primary_base: "ExtraTrees"
  ensemble_method: "weighted"
  pipeline: "2stage_binary"

monitoring:
  sl_tp_poll_seconds: 30
  position_persist: true
  model_artifact_save: true

# ── Coin-Specific Parameters (unchanged from v4.2) ────
coins:
  DOT:
    stage1_threshold: 0.45
    max_features: 120
    n_estimators: 300
    max_depth_tree: 8
    min_child_samples: 10
    blocked_regimes_override: [RANGE_LOW]
    model_combo: "et+tabm"
    model_weights: { et: 0.7, tabm: 0.3 }

  ADA:
    stage1_threshold: 0.40
    max_features: 120
    n_estimators: 300
    max_depth_tree: 8
    min_child_samples: 10
    blocked_regimes_override: [RANGE_LOW, UNKNOWN]
    model_combo: "et+cb"
    model_weights: { et: 0.5, cb: 0.5 }

  XRP:
    stage1_threshold: 0.45
    max_features: 120
    n_estimators: 300
    max_depth_tree: 8
    min_child_samples: 10
    blocked_regimes_override: [RANGE_LOW]
    model_combo: "et+cb"
    model_weights: { et: 0.5, cb: 0.5 }

  SOL:
    stage1_threshold: 0.45
    max_features: 120
    n_estimators: 300
    max_depth_tree: 8
    min_child_samples: 10
    blocked_regimes_override: [RANGE_LOW]
    model_combo: "et+cb"
    model_weights: { et: 0.5, cb: 0.5 }

  LINK:
    stage1_threshold: 0.45
    max_features: 120
    n_estimators: 300
    max_depth_tree: 8
    min_child_samples: 10
    blocked_regimes_override: [RANGE_LOW]
    model_combo: "et+xgb"
    model_weights: { et: 0.5, xgb: 0.5 }

# ── Confidence-Tiered Sizing + DD Brake ────────────────
sizing_tiers:
  tier_high: 0.015             # confidence > 0.65 → 1.5% of equity
  tier_mid: 0.010              # confidence 0.50-0.65 → 1.0%
  tier_low: 0.005              # confidence < 0.50 → 0.5% (baseline)
  dd_brake_threshold: 0.015    # daily DD > 1.5% → halve all tiers

# ── RL Meta-Layer (v4.3 NEW) ──────────────────────────
rl:
  shadow_mode: true              # Phase 1-3: true (로그만), Phase 4: false (실적용)
  warmup_signals: 200            # 이전은 항상 ACCEPT_1.00
  max_new_per_cycle: 3           # 동시 신규 진입 제한
  alpha: 1.0                     # UCB exploration parameter
  gamma: 0.995                   # forgetting factor
  model_path: "data/models/rl/linucb_v1.joblib"
  signal_log: "data/reports/live_trading_v2/signal_log.jsonl"
  # actions: [REJECT, ACCEPT_0.75, ACCEPT_1.00, ACCEPT_1.25]
  # state_dim: 31 (30 features + intercept)

# ── Frozen OOS (unchanged) ─────────────────────────────
frozen_oos:
  method: "walk-forward"
  n_windows: 4
  train_bars: 360
  test_bars: 90
  gap_bars: 6
  pass_criteria:
    min_net_ev_per_trade: 0.002
    min_trades_per_window: 5
    max_avg_dd: 0.05
    min_windows_positive: 3
  coins_to_validate: [DOT, ADA, XRP, SOL, LINK]
  output_dir: "data/reports/frozen_oos_v4_3/"
